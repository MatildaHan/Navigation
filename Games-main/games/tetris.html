<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>俄罗斯方块</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../../assets/css/apps.css">
<style>
body.tetris-app .game-inner { padding: 12px; overflow: hidden; background: rgba(15, 34, 39, .86); }
body.tetris-app .game-inner > .tetris-layout { --info-width: 116px; --controls-width: 116px; --layout-gap: 24px; display: grid; grid-template-columns: var(--info-width) var(--board-width, 337.5px) var(--controls-width); gap: var(--layout-gap); align-items: center; justify-content: center; width: max-content; max-width: 100%; height: var(--board-height, 450px); min-height: 0; margin: auto; }
.tetris-main { grid-column: 2; grid-row: 1; width: var(--board-width, 337.5px); }
#tetris-canvas { display: block; width: 100%; height: var(--board-height, 450px); border: 1px solid var(--border); border-radius: 0; background: #102125; touch-action: none; }
#tetris-canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tetris-info, .tetris-controls { display: grid; grid-template-rows: minmax(0, 1fr) 90px 34px; row-gap: 14px; height: 100%; min-height: 0; }
.tetris-info { grid-column: 1; grid-row: 1; }
.tetris-controls { grid-column: 3; grid-row: 1; grid-template-rows: minmax(0, 1fr) auto 34px; }
.tetris-stats { display: grid; gap: 6px; align-self: center; }
.tetris-stats > div { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.tetris-stats dt, .tetris-next-label { font-size: 13px; color: var(--text-sub); }
.tetris-stats dd { font-size: 16px; font-variant-numeric: tabular-nums; }
.tetris-stats .tetris-score { display: block; margin-bottom: 6px; }
.tetris-score dd { margin-top: 2px; font-size: 28px; line-height: 1.2; }
.tetris-stats .tetris-best { color: var(--text-sub); font-size: 12px; }
.tetris-next { grid-row: 2; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; justify-content: flex-end; }
.tetris-next-label { line-height: 20px; }
#next-canvas { display: block; width: 64px; height: 64px; border: 1px solid var(--border); border-radius: 8px; background: #102125; }
.tetris-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; align-self: center; }
.tetris-button, .tetris-touch { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 32px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 8px; background: #243b40; color: var(--text); font: inherit; font-size: 12px; cursor: pointer; touch-action: manipulation; }
.tetris-button.primary { background: var(--accent); color: #06201a; border-color: transparent; }
.tetris-button:disabled { opacity: .45; cursor: not-allowed; }
.touch-controls { grid-row: 2; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-areas: '. rotate .' 'left down right' 'drop drop drop'; gap: 6px; align-self: end; }
.tetris-touch { height: 32px; font-size: 18px; padding: 0; }
.tetris-touch[data-action="left"] { grid-area: left; }
.tetris-touch[data-action="rotate"] { grid-area: rotate; }
.tetris-touch[data-action="right"] { grid-area: right; }
.tetris-touch[data-action="down"] { grid-area: down; }
.tetris-touch[data-action="drop"] { grid-area: drop; background: var(--accent); color: #06201a; border-color: transparent; font-size: 14px; font-weight: 600; }
.tetris-touch:active:not(:disabled) { transform: translateY(1px); filter: brightness(.9); }
.tetris-touch:disabled { opacity: .45; cursor: not-allowed; }
.tetris-key-hint { grid-row: 3; color: var(--text-sub); font-size: 11px; line-height: 1.5; text-align: center; align-self: center; }
.tetris-modal .modal-box { width: min(340px, calc(100% - 24px)); padding: 24px; }
.tetris-modal .modal-actions { display: flex; flex-direction: row; gap: 8px; }
.tetris-modal .modal-actions .tetris-button { flex: 1; min-height: 40px; }
body.tetris-app.standalone-app .game-inner { height: min(560px, calc(var(--app-height) - 90px)); }
@media (max-width: 600px) {
    body.tetris-app .game-inner { padding: 2px; background: linear-gradient(145deg,rgba(36,59,64,.88),rgba(15,34,39,.94)); }
    body.tetris-app .game-inner > .tetris-layout { --layout-gap: 8px; grid-template-columns: minmax(0,1fr) auto; grid-template-rows: auto minmax(0,1fr) auto; gap: var(--layout-gap); width: 100%; height: 100%; }
    .tetris-main { grid-column: 1 / -1; grid-row: 2; justify-self: center; align-self: center; }
    #tetris-canvas { border-color: rgba(190,215,215,.28); box-shadow: 0 8px 24px rgba(0,0,0,.18); }
    .tetris-info { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; height: auto; }
    .tetris-stats { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 3px 8px; min-width: 0; flex: 1; }
    .tetris-stats > div, .tetris-stats .tetris-score { display: flex; align-items: baseline; gap: 4px; margin: 0; min-width: 0; }
    .tetris-stats dt { font-size: 10px; white-space: nowrap; }
    .tetris-stats dd { font-size: 14px; overflow-wrap: anywhere; }
    .tetris-score dd { margin: 0; color: var(--accent); font-size: 18px; font-weight: 600; }
    .tetris-stats .tetris-best { font-size: 10px; }
    .tetris-next { flex: none; gap: 2px; align-items: center; }
    .tetris-next-label { font-size: 9px; line-height: 12px; }
    #next-canvas { width: 32px; height: 32px; border-radius: 6px; }
    .tetris-controls { display: contents; }
    .tetris-actions { grid-column: 2; grid-row: 1; gap: 4px; }
    .tetris-actions .tetris-button { width: 44px; height: 48px; padding: 0; border-radius: 10px; }
    .touch-controls { grid-column: 1 / -1; grid-row: 3; grid-template-columns: repeat(4,minmax(44px,1fr)) minmax(56px,1.35fr); grid-template-areas: 'left right down rotate drop'; gap: 6px; width: 100%; padding: 4px; border: 1px solid rgba(255,255,255,.12); border-radius: 16px; background: rgba(255,255,255,.035); }
    .tetris-touch { height: 52px; min-height: 52px; border-radius: 12px; font-size: 24px; background: linear-gradient(160deg,rgba(81,115,123,.45),rgba(36,59,64,.8)); }
    .tetris-touch[data-action="drop"] { font-size: 16px; box-shadow: 0 4px 16px rgba(82,224,189,.12); }
    .tetris-key-hint { display: none; }
    body.tetris-app.standalone-app { padding: 8px max(8px,var(--safe-right)) max(8px,var(--safe-bottom)) max(8px,var(--safe-left)); }
    body.tetris-app.standalone-app .game-inner { height: calc(var(--app-height) - 64px - var(--safe-bottom)); }
}
@media (max-width: 600px) and (max-height: 360px) {
    .tetris-touch { height: 44px; min-height: 44px; }
    .touch-controls { gap: 6px; padding: 4px; }
}
@media (min-width: 601px) and (max-height: 300px) {
    body.tetris-app .game-inner > .tetris-layout { --info-width: 190px; --layout-gap: 12px; }
    .tetris-info { display: flex; align-items: center; gap: 12px; }
    .tetris-stats { flex: 1; gap: 3px; }
    .tetris-stats dt, .tetris-stats dd { font-size: 12px; }
    .tetris-stats .tetris-score { margin: 0; }
    .tetris-score dd { font-size: 20px; }
    .tetris-next { flex: none; }
    #next-canvas { width: 56px; height: 56px; }
    .tetris-controls { grid-template-rows: 30px minmax(0, 1fr); row-gap: 6px; }
    .tetris-button, .tetris-touch { min-height: 28px; height: 28px; }
    .touch-controls { align-self: center; }
    .tetris-key-hint { display: none; }
}
@media (pointer: coarse) and (min-width: 601px) and (min-height: 301px) {
    .tetris-button, .tetris-touch { min-height: 44px; height: 44px; }
    .tetris-info { grid-template-rows: minmax(0, 1fr) 94px 34px; }
    .tetris-controls { grid-template-rows: minmax(0, 1fr) auto 34px; }
}
@media (min-width: 601px) and (min-height: 240px) and (max-height: 300px) {
    .tetris-button, .tetris-touch { min-height: 44px; height: 44px; }
    .tetris-controls { grid-template-rows: 44px minmax(0,1fr) 34px; }
}
</style>
</head>
<body class="game-app embedded tetris-app">
<div class="game-inner">
    <div class="tetris-layout">
        <aside class="tetris-info" aria-label="得分与下一个方块">
            <dl class="tetris-stats">
                <div class="tetris-score"><dt>得分</dt><dd id="score">0</dd></div>
                <div><dt>等级</dt><dd id="level">1</dd></div>
                <div><dt>消行</dt><dd id="lines">0</dd></div>
                <div><dt class="tetris-best">最高分</dt><dd class="tetris-best" id="best">0</dd></div>
            </dl>
            <div class="tetris-next">
                <span class="tetris-next-label">下一个</span>
                <canvas id="next-canvas" width="120" height="120" aria-label="下一个方块预览"></canvas>
            </div>
        </aside>
        <div class="tetris-main" id="tetrisMain">
            <canvas id="tetris-canvas" width="360" height="480" tabindex="0" aria-label="俄罗斯方块棋盘，15 列 20 行，方向键移动和旋转，空格快速落下，P 暂停"></canvas>
        </div>
        <aside class="tetris-controls" aria-label="游戏操作">
            <div class="tetris-actions">
                <button class="tetris-button primary" id="btnStart">开始</button>
                <button class="tetris-button" id="btnPause" disabled>暂停</button>
            </div>
            <div class="touch-controls" id="touchControls" aria-label="方向与旋转操作">
                <button class="tetris-touch" data-action="left" aria-label="向左移动">←</button>
                <button class="tetris-touch" data-action="right" aria-label="向右移动">→</button>
                <button class="tetris-touch" data-action="down" aria-label="向下移动">↓</button>
                <button class="tetris-touch" data-action="rotate" aria-label="旋转方块">↻</button>
                <button class="tetris-touch" data-action="drop" aria-label="快速落下方块">落下</button>
            </div>
            <p class="tetris-key-hint">方向键移动与旋转<br>空格落下 · P 暂停</p>
        </aside>
    </div>
</div>

<div class="modal tetris-modal" id="modal" aria-labelledby="modalTitle">
    <div class="modal-box">
        <h2 id="modalTitle">游戏结束</h2>
        <p id="modalSub">最终得分<span class="big-value" id="finalScore">0</span></p>
        <div class="modal-actions">
            <button class="tetris-button primary" id="btnRestart">重新开始</button>
            <button class="tetris-button" id="btnLeave">关闭</button>
        </div>
    </div>
</div>

<script src="../js/bridge.js"></script>
<script src="../../assets/js/app-common.js"></script>
<script>
(function () {
    'use strict';

    document.body.classList.add('embedded');

    const COLS = 15, ROWS = 20, BLOCK = 24;
    const BASE_INTERVAL = 800;
    const MIN_INTERVAL = 100;

    const PIECES = [
        { shape: [[1,1,1,1]], color: '#00e0e0' },
        { shape: [[1,1],[1,1]], color: '#f7d51d' },
        { shape: [[0,1,0],[1,1,1]], color: '#a020f0' },
        { shape: [[0,1,1],[1,1,0]], color: '#00c020' },
        { shape: [[1,1,0],[0,1,1]], color: '#e03030' },
        { shape: [[1,0,0],[1,1,1]], color: '#2060f0' },
        { shape: [[0,0,1],[1,1,1]], color: '#f08000' }
    ];

    let bag = [];
    function nextFromBag() {
        if (bag.length === 0) {
            bag = PIECES.map((_, i) => i);
            for (let i = bag.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [bag[i], bag[j]] = [bag[j], bag[i]];
            }
        }
        const piece = PIECES[bag.pop()];
        return { shape: piece.shape.map(row => [...row]), color: piece.color };
    }

    const canvas = document.getElementById('tetris-canvas');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next-canvas');
    const nextCtx = nextCanvas.getContext('2d');
    const layoutEl = document.querySelector('.tetris-layout');

    // 逻辑尺寸固定
    canvas.width = COLS * BLOCK;
    canvas.height = ROWS * BLOCK;
    ctx.imageSmoothingEnabled = false;
    nextCanvas.width = 120;
    nextCanvas.height = 120;
    nextCtx.imageSmoothingEnabled = false;

    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const linesEl = document.getElementById('lines');
    const bestEl = document.getElementById('best');
    const btnStart = document.getElementById('btnStart');
    const btnPause = document.getElementById('btnPause');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalSub = document.getElementById('modalSub');
    const btnRestart = document.getElementById('btnRestart');
    const btnLeave = document.getElementById('btnLeave');
    const touchControls = document.getElementById('touchControls');
    const touchButtons = [...touchControls.querySelectorAll('button')];

    let board, score, level, lines, current, next, dropCounter, lastTime, rafId, state;
    let bestScore = 0;
    try { const saved = Number(localStorage.getItem('tetrisBest')); if (Number.isSafeInteger(saved) && saved >= 0) bestScore = saved; } catch (e) {}

    // Mobile reserves the actual status and touch rows; desktop keeps its side panels.
    const innerEl = document.querySelector('.game-inner');
    function updateBoardWidth() {
        const style = getComputedStyle(innerEl);
        const layoutStyle = getComputedStyle(layoutEl);
        const gap = parseFloat(layoutStyle.getPropertyValue('--layout-gap')) || 0;
        const infoWidth = parseFloat(layoutStyle.getPropertyValue('--info-width')) || 0;
        const controlsWidth = parseFloat(layoutStyle.getPropertyValue('--controls-width')) || 0;
        const narrow = window.matchMedia('(max-width: 600px)').matches;
        const controlsHeight = narrow ? Math.max(document.querySelector('.tetris-info').getBoundingClientRect().height,
            document.querySelector('.tetris-actions').getBoundingClientRect().height)
            + touchControls.getBoundingClientRect().height + gap * 2 : 0;
        const widthBudget = innerEl.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight)
            - (narrow ? 0 : infoWidth + controlsWidth + gap * 2);
        const heightBudget = innerEl.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom) - controlsHeight;
        const boardW = Math.max(1, Math.floor(Math.min(widthBudget, heightBudget * COLS / ROWS)));
        layoutEl.style.setProperty('--board-width', boardW + 'px');
        layoutEl.style.setProperty('--board-height', boardW * ROWS / COLS + 'px');
    }
    const boardObserver = new ResizeObserver(updateBoardWidth);
    [innerEl, document.querySelector('.tetris-info'), document.querySelector('.tetris-actions'), touchControls].forEach(node => boardObserver.observe(node));
    updateBoardWidth();

    function reset() {
        board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        score = 0;
        level = 1;
        lines = 0;
        current = null;
        next = null;
        dropCounter = 0;
        lastTime = 0;
        state = 'idle';
        if (rafId) cancelAnimationFrame(rafId);
        scoreEl.textContent = '0';
        updateLevelUI();
        btnStart.textContent = '开始';
        btnStart.setAttribute('aria-label', '开始游戏');
        btnStart.disabled = false;
        btnPause.disabled = true;
        touchButtons.forEach(button => { button.disabled = true; });
        modal.classList.remove('show');
        draw();
        drawNext();
    }

    function updateLevelUI() {
        levelEl.textContent = level;
        linesEl.textContent = lines;
        bestEl.textContent = bestScore;
    }

    function dropInterval() {
        return Math.max(MIN_INTERVAL, BASE_INTERVAL - (level - 1) * 60);
    }

    function spawn() {
        current = next || nextFromBag();
        next = nextFromBag();
        drawNext();
        current.x = Math.floor((COLS - current.shape[0].length) / 2);
        current.y = 0;
        if (collide()) endGame();
    }

    function collide(shape, ox, oy) {
        shape = shape || (current && current.shape);
        if (!shape) return false;
        ox = (ox === undefined) ? current.x : ox;
        oy = (oy === undefined) ? current.y : oy;
        for (let y = 0; y < shape.length; y++) {
            for (let x = 0; x < shape[y].length; x++) {
                if (!shape[y][x]) continue;
                const bx = ox + x, by = oy + y;
                if (bx < 0 || bx >= COLS || by >= ROWS) return true;
                if (by >= 0 && board[by][bx]) return true;
            }
        }
        return false;
    }

    function merge() {
        current.shape.forEach((row, y) => {
            row.forEach((v, x) => {
                if (v && current.y + y >= 0) {
                    board[current.y + y][current.x + x] = current.color;
                }
            });
        });
        clearLines();
        spawn();
    }

    function clearLines() {
        let cleared = 0;
        for (let y = ROWS - 1; y >= 0; y--) {
            if (board[y].every(v => v !== 0)) {
                board.splice(y, 1);
                board.unshift(Array(COLS).fill(0));
                cleared++;
                y++;
            }
        }
        if (cleared > 0) {
            const points = [0, 100, 300, 500, 800];
            score += points[cleared] * level;
            lines += cleared;
            const newLevel = Math.floor(lines / 10) + 1;
            if (newLevel !== level) level = newLevel;
            scoreEl.textContent = score;
            updateLevelUI();
            if (score > bestScore) {
                bestScore = score;
                try { localStorage.setItem('tetrisBest', String(bestScore)); } catch (e) {}
                updateLevelUI();
            }
        }
    }

    function rotate() {
        if (!current || state !== 'running') return;
        const rotated = current.shape[0].map((_, i) => current.shape.map(r => r[i]).reverse());
        const oldShape = current.shape;
        const kicks = [0, -1, 1, -2, 2];
        for (const dx of kicks) {
            if (!collide(rotated, current.x + dx, current.y)) {
                current.shape = rotated;
                current.x += dx;
                draw();
                return;
            }
        }
        current.shape = oldShape;
    }

    function move(dx) {
        if (!current || state !== 'running') return;
        if (!collide(current.shape, current.x + dx, current.y)) {
            current.x += dx;
            draw();
        }
    }

    function softDrop() {
        if (!current || state !== 'running') return;
        if (!collide(current.shape, current.x, current.y + 1)) {
            current.y++;
        } else {
            merge();
        }
        dropCounter = 0;
        draw();
    }

    function hardDrop() {
        if (!current || state !== 'running') return;
        while (!collide(current.shape, current.x, current.y + 1)) current.y++;
        merge();
        dropCounter = 0;
        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#102125';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(134, 162, 165, 0.2)';
        ctx.lineWidth = 1;
        for (let i = 1; i < COLS; i++) {
            ctx.beginPath();
            ctx.moveTo(i * BLOCK + 0.5, 0);
            ctx.lineTo(i * BLOCK + 0.5, canvas.height);
            ctx.stroke();
        }
        for (let i = 1; i < ROWS; i++) {
            ctx.beginPath();
            ctx.moveTo(0, i * BLOCK + 0.5);
            ctx.lineTo(canvas.width, i * BLOCK + 0.5);
            ctx.stroke();
        }

        board.forEach((row, y) => row.forEach((c, x) => { if (c) drawBlock(x, y, c); }));
        if (current) {
            current.shape.forEach((row, y) => row.forEach((v, x) => {
                if (v) drawBlock(current.x + x, current.y + y, current.color);
            }));
        }
    }

    function drawBlock(x, y, color) {
        const px = x * BLOCK, py = y * BLOCK;
        const S = BLOCK;
        ctx.fillStyle = color;
        ctx.fillRect(px, py, S, S);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.fillRect(px, py, S, 3);
        ctx.fillRect(px, py, 3, S);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.fillRect(px, py + S - 3, S, 3);
        ctx.fillRect(px + S - 3, py, 3, S);

        ctx.strokeStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 0.5, py + 0.5, S - 1, S - 1);
    }

    function drawNext() {
        nextCtx.clearRect(0, 0, 120, 120);
        nextCtx.fillStyle = '#102125';
        nextCtx.fillRect(0, 0, 120, 120);
        if (!next) return;
        const shape = next.shape;
        const bs = 24;
        const ox = (120 - shape[0].length * bs) / 2;
        const oy = (120 - shape.length * bs) / 2;
        shape.forEach((row, y) => row.forEach((v, x) => {
            if (!v) return;
            const px = ox + x * bs, py = oy + y * bs;
            nextCtx.fillStyle = next.color;
            nextCtx.fillRect(px, py, bs - 2, bs - 2);
            nextCtx.fillStyle = 'rgba(255, 255, 255, 0.55)';
            nextCtx.fillRect(px, py, bs - 2, 3);
            nextCtx.fillRect(px, py, 3, bs - 2);
            nextCtx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            nextCtx.fillRect(px, py + bs - 5, bs - 2, 3);
            nextCtx.fillRect(px + bs - 5, py, 3, bs - 2);
            nextCtx.strokeStyle = 'rgba(0, 0, 0, 0.85)';
            nextCtx.lineWidth = 1;
            nextCtx.strokeRect(px + 0.5, py + 0.5, bs - 3, bs - 3);
        }));
    }

    function loop(time = 0) {
        if (state !== 'running') return;
        if (!lastTime) lastTime = time;
        const dt = time - lastTime;
        lastTime = time;
        dropCounter += dt;
        if (dropCounter > dropInterval()) softDrop();
        draw();
        if (state === 'running') rafId = requestAnimationFrame(loop);
    }

    function start() {
        reset();
        state = 'running';
        next = nextFromBag();
        spawn();
        lastTime = 0;
        dropCounter = 0;
        rafId = requestAnimationFrame(loop);
        btnStart.textContent = '重开';
        btnStart.setAttribute('aria-label', '重新开始游戏');
        canvas.focus({ preventScroll: true });
        btnPause.disabled = false;
        touchButtons.forEach(button => { button.disabled = false; });
    }

    function pause() {
        if (state === 'running') {
            state = 'paused';
            if (rafId) cancelAnimationFrame(rafId);
            showModal('已暂停', '准备好后继续游戏', '继续', '结束');
            btnRestart.onclick = resume;
            btnLeave.onclick = () => { modal.classList.remove('show'); leave(); };
        }
    }
    function resume() {
        if (state !== 'paused') return;
        modal.classList.remove('show');
        state = 'running';
        lastTime = 0;
        dropCounter = 0;
        rafId = requestAnimationFrame(loop);
        canvas.focus({ preventScroll: true });
    }

    function endGame() {
        state = 'over';
        if (rafId) cancelAnimationFrame(rafId);
        showModal('游戏结束', '最终得分', '重新开始', '关闭', score);
        btnRestart.onclick = start;
        btnLeave.onclick = () => { modal.classList.remove('show'); leave(); };
    }

    function showModal(title, sub, restartText, leaveText, bigValue) {
        modalTitle.textContent = title;
        modalSub.innerHTML = sub + '<span class="big-value" id="finalScore"></span>';
        const el = modalSub.querySelector('#finalScore');
        if (bigValue !== null && bigValue !== undefined) el.textContent = bigValue;
        btnRestart.textContent = restartText;
        btnLeave.textContent = leaveText;
        modal.classList.add('show');
        btnRestart.focus({ preventScroll: true });
    }

    function leave() {
        modal.classList.remove('show');
        reset();
    }

    btnStart.onclick = start;
    btnPause.addEventListener('click', pause);

    touchControls.addEventListener('click', (e) => {
        const btn = e.target.closest('.tetris-touch');
        if (!btn) return;
        const action = btn.dataset.action;
        if (action === 'left') move(-1);
        else if (action === 'right') move(1);
        else if (action === 'down') softDrop();
        else if (action === 'rotate') rotate();
        else if (action === 'drop') hardDrop();
    });

    let touchStartX = 0, touchStartY = 0, touchMoved = false;
    canvas.addEventListener('touchstart', (e) => {
        if (state !== 'running') return;
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        touchMoved = false;
    }, { passive: true });
    canvas.addEventListener('touchmove', (e) => {
        if (state !== 'running') return;
        const t = e.touches[0];
        const dx = t.clientX - touchStartX;
        const dy = t.clientY - touchStartY;
        const threshold = 30;
        if (Math.abs(dx) > threshold && Math.abs(dx) > Math.abs(dy)) {
            move(dx > 0 ? 1 : -1);
            touchStartX = t.clientX;
            touchMoved = true;
        } else if (dy > threshold) {
            softDrop();
            touchStartY = t.clientY;
            touchMoved = true;
        }
    }, { passive: true });
    canvas.addEventListener('touchend', () => {
        if (state !== 'running') return;
        if (!touchMoved) rotate();
    });

    document.addEventListener('keydown', e => {
        if (e.key === 'p' || e.key === 'P') {
            e.preventDefault();
            if (state === 'running') pause();
            else if (state === 'paused') resume();
            return;
        }
        if (state !== 'running') return;
        const keys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '];
        // Space/Enter on a focused control must activate its native click only once.
        if (e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
        if (keys.includes(e.key)) e.preventDefault();
        if (e.repeat && ['ArrowUp', ' '].includes(e.key)) return;
        switch (e.key) {
            case 'ArrowLeft': move(-1); break;
            case 'ArrowRight': move(1); break;
            case 'ArrowDown': softDrop(); break;
            case 'ArrowUp': rotate(); break;
            case ' ': hardDrop(); break;
        }
    });

    GameBridge.onParentMessage((msg) => {
        if (msg.type === 'pause' && state === 'running') pause();
    });

    GameBridge.onVisibilityChange((hidden) => {
        if (hidden && state === 'running') pause();
    });

    reset();
})();
</script>
</body>
</html>
