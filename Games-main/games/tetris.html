<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>俄罗斯方块</title>
<link rel="stylesheet" href="../css/common.css">
<style>
/* ============================================================
   像素复古主题
   ============================================================ */
.px-theme,
.px-theme * {
    font-family: "Courier New", Consolas, Monaco, monospace;
    letter-spacing: 1px;
}
.px-theme {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    --px-bg:        #0b0e1a;
    --px-panel:     #1a2140;
    --px-panel-2:   #222a52;
    --px-border:    #3a4a7a;
    --px-border-hi: #6a7ec4;
    --px-text:      #e8f0ff;
    --px-text-dim:  #8a9ac4;
    --px-accent:    #f7d51d;
}

.px-theme.game-inner {
    background:
        radial-gradient(ellipse at center, #1a2140 0%, #0b0e1a 70%),
        #0b0e1a;
    padding: 8px;
    position: relative;
}
.px-theme.game-inner::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image:
        linear-gradient(rgba(58, 74, 122, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(58, 74, 122, 0.15) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
}
.px-theme.game-inner::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.12) 0px,
        rgba(0, 0, 0, 0.12) 2px,
        transparent 2px,
        transparent 6px
    );
    opacity: 0.25;
}
.px-theme .tetris-layout {
    position: relative;
    z-index: 2;
}

/* ============================================================
   布局：主区 + 右栏（桌面/平板/手机统一）
   ============================================================ */
.px-theme .tetris-layout {
    display: flex;
    flex-wrap: nowrap;
    gap: 10px;
    align-items: stretch;
    justify-content: center;
    width: 100%;
    min-height: 100%;
}

/* 主区：画布 + 底部按钮 */
.px-theme .tetris-main {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: stretch;
    flex: 0 0 auto;
    /* 宽度由 JS 动态设置 --board-width */
    width: var(--board-width, auto);
}

/* 右栏：信息卡 + 操作按钮 */
.px-theme .tetris-rail {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 0 0 auto;
    /* 宽度自适应剩余空间 */
    width: auto;
    min-width: 0;
}

/* ============================================================
   画布
   ============================================================ */
.px-theme #tetris-canvas {
    display: block;
    background: #000;
    border: 4px solid var(--px-border);
    box-shadow:
        inset 0 0 0 4px var(--px-bg),
        0 0 0 4px var(--px-bg),
        8px 8px 0 0 rgba(0, 0, 0, 0.6);
    width: 100%;
    height: auto;
    touch-action: none;
    image-rendering: pixelated;
    box-sizing: border-box;
}

/* ============================================================
   像素卡片
   ============================================================ */
.px-theme .px-card {
    background: var(--px-panel);
    border: 2px solid var(--px-border);
    box-shadow:
        inset 0 0 0 2px var(--px-bg),
        inset 0 0 0 4px var(--px-panel-2),
        0 0 0 2px var(--px-bg),
        3px 3px 0 0 rgba(0, 0, 0, 0.5);
    padding: 8px;
    border-radius: 0;
    position: relative;
}
.px-theme .px-card .card-title {
    font-size: 9px;
    color: var(--px-text-dim);
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-transform: uppercase;
    text-align: center;
}
.px-theme .px-card .card-value {
    font-size: 16px;
    color: var(--px-accent);
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 2px 2px 0 #000;
    text-align: center;
}

.px-theme #next-canvas {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    height: auto;
    background: #000;
    border: 2px solid var(--px-border);
    image-rendering: pixelated;
    width: 100%;
    box-sizing: border-box;
}

/* ============================================================
   像素按钮
   ============================================================ */
.px-theme .px-btn {
    background: var(--px-panel-2);
    color: var(--px-text);
    border: 3px solid var(--px-border);
    box-shadow:
        inset -3px -3px 0 0 rgba(0, 0, 0, 0.5),
        inset 3px 3px 0 0 var(--px-border-hi),
        0 0 0 3px var(--px-bg),
        4px 4px 0 0 rgba(0, 0, 0, 0.6);
    padding: 10px 8px;
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 0;
    font-family: inherit;
    min-height: 40px;
    text-transform: uppercase;
    transition: transform 0.05s, box-shadow 0.05s;
    width: 100%;
}
.px-theme .px-btn:hover:not(:disabled) {
    background: var(--px-border);
    color: #fff;
}
.px-theme .px-btn:active:not(:disabled) {
    transform: translate(3px, 3px);
    box-shadow:
        inset -3px -3px 0 0 rgba(0, 0, 0, 0.5),
        inset 3px 3px 0 0 var(--px-border-hi),
        0 0 0 3px var(--px-bg),
        1px 1px 0 0 rgba(0, 0, 0, 0.6);
}
.px-theme .px-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    color: var(--px-text-dim);
}
.px-theme .px-btn.primary {
    background: var(--px-accent);
    color: #000;
    border-color: #8a6a00;
}
.px-theme .px-btn.primary:hover:not(:disabled) { background: #fff; }
.px-theme .px-btn.tall {
    height: 56px;
    font-size: 12px;
}

/* 底部「重新开始」按钮：画布下方整行 */
.px-theme .tetris-restart {
    width: 100%;
    min-height: 44px;
    font-size: 12px;
}

/* ============================================================
   触屏按钮（画布下方）
   ============================================================ */
.px-theme .touch-controls {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    width: 100%;
}
.px-theme .px-touch-btn {
    background: var(--px-panel-2);
    border: 3px solid var(--px-border);
    box-shadow:
        inset -3px -3px 0 0 rgba(0, 0, 0, 0.5),
        inset 3px 3px 0 0 var(--px-border-hi),
        0 0 0 3px var(--px-bg);
    color: var(--px-text);
    height: 48px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    touch-action: manipulation;
}
.px-theme .px-touch-btn:active {
    transform: translate(2px, 2px);
    background: var(--px-border);
}

/* ============================================================
   模态框
   ============================================================ */
.px-theme .modal-box {
    background: var(--px-panel);
    border: 4px solid var(--px-border);
    box-shadow:
        inset 0 0 0 3px var(--px-bg),
        0 0 0 4px var(--px-bg),
        8px 8px 0 0 rgba(0, 0, 0, 0.6);
    border-radius: 0;
    padding: 32px 40px;
    font-family: "Courier New", monospace;
}
.px-theme .modal-box h2 {
    color: var(--px-accent);
    font-size: 18px;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 #000;
    margin-bottom: 16px;
}
.px-theme .modal-box p {
    color: var(--px-text-dim);
    font-size: 12px;
    letter-spacing: 1px;
}
.px-theme .modal-box .big-value {
    color: #fff;
    font-size: 28px;
    text-shadow: 3px 3px 0 var(--px-border);
    font-weight: 700;
}
.px-theme .modal-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
}
.px-theme .modal-actions .px-btn { flex: 1; }

/* ============================================================
   桌面端优化（可选）
   ============================================================ */
@media (min-width: 768px) {
    .px-theme.game-inner { padding: 16px; }
    .px-theme .tetris-layout { gap: 16px; }
    .px-theme .px-card .card-title { font-size: 10px; }
    .px-theme .px-card .card-value { font-size: 18px; }
    .px-theme .px-btn { font-size: 11px; padding: 12px 8px; min-height: 44px; }
}
</style>
<link rel="stylesheet" href="../../assets/css/apps.css">
</head>
<body class="embedded">
<div class="game-inner px-theme">
    <div class="tetris-layout">
        <!-- 主区：画布 + 重新开始 + 触屏按钮 -->
        <div class="tetris-main" id="tetrisMain">
            <canvas id="tetris-canvas" width="240" height="480"></canvas>
            <button class="px-btn primary tetris-restart" id="btnStart">START</button>
            <div class="touch-controls" id="touchControls">
                <button class="px-touch-btn" data-action="left" aria-label="向左移动">←</button>
                <button class="px-touch-btn" data-action="rotate" aria-label="旋转方块">↻</button>
                <button class="px-touch-btn" data-action="right" aria-label="向右移动">→</button>
                <button class="px-touch-btn" data-action="down" aria-label="向下移动">↓</button>
            </div>
        </div>

        <!-- 右栏：NEXT / SCORE / LEVEL / ROTATE / PAUSE -->
        <div class="tetris-rail">
            <div class="px-card">
                <div class="card-title">NEXT</div>
                <canvas id="next-canvas" width="120" height="120"></canvas>
            </div>
            <div class="px-card">
                <div class="card-title">SCORE</div>
                <div class="card-value" id="score">0</div>
            </div>
            <div class="px-card">
                <div class="card-title">LEVEL / BEST</div>
                <div class="card-value" style="font-size:12px;" id="level">1 / 0</div>
            </div>
            <button class="px-btn" id="btnRotate">ROTATE</button>
            <button class="px-btn" id="btnPause">PAUSE</button>
        </div>
    </div>
</div>

<div class="modal px-theme" id="modal">
    <div class="modal-box">
        <h2 id="modalTitle">GAME OVER</h2>
        <p id="modalSub">FINAL SCORE<span class="big-value" id="finalScore">0</span></p>
        <div class="modal-actions">
            <button class="px-btn primary" id="btnRestart">RESTART</button>
            <button class="px-btn" id="btnLeave">CLOSE</button>
        </div>
    </div>
</div>

<script src="../js/bridge.js"></script>
<script src="../../assets/js/app-common.js" defer></script>
<script>
(function () {
    'use strict';

    document.body.classList.add('embedded');
    GameBridge.notifyReady();

    const COLS = 10, ROWS = 20, BLOCK = 24;
    const BASE_INTERVAL = 800;
    const MIN_INTERVAL = 100;

    const PIECES = [
        { shape: [[1,1,1,1]], color: '#00e0e0' },
        { shape: [[1,1],[1,1]], color: '#f7d51d' },
        { shape: [[0,1,0],[1,1,1]], color: '#a020f0' },
        { shape: [[0,1,1],[1,1,0]], color: '#00c020' },
        { shape: [[1,1,0],[0,1,1]], color: '#e03030' },
        { shape: [[1,0,0],[1,1,1]], color: '#2060f0' },
        { shape: [[0,0,1],[1,1,1]], color: '#f08000' }
    ];

    let bag = [];
    function nextFromBag() {
        if (bag.length === 0) {
            bag = PIECES.map((_, i) => i);
            for (let i = bag.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [bag[i], bag[j]] = [bag[j], bag[i]];
            }
        }
        const piece = PIECES[bag.pop()];
        return { shape: piece.shape.map(row => [...row]), color: piece.color };
    }

    const canvas = document.getElementById('tetris-canvas');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next-canvas');
    const nextCtx = nextCanvas.getContext('2d');
    const mainEl = document.getElementById('tetrisMain');
    const layoutEl = document.querySelector('.tetris-layout');

    // 逻辑尺寸固定
    canvas.width = 240;
    canvas.height = 480;
    ctx.imageSmoothingEnabled = false;
    nextCanvas.width = 120;
    nextCanvas.height = 120;
    nextCtx.imageSmoothingEnabled = false;

    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const btnStart = document.getElementById('btnStart');
    const btnRotate = document.getElementById('btnRotate');
    const btnPause = document.getElementById('btnPause');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalSub = document.getElementById('modalSub');
    const btnRestart = document.getElementById('btnRestart');
    const btnLeave = document.getElementById('btnLeave');
    const touchControls = document.getElementById('touchControls');

    let board, score, level, lines, current, next, dropCounter, lastTime, rafId, state;
    let bestScore = 0;
    try { const saved = Number(localStorage.getItem('tetrisBest')); if (Number.isSafeInteger(saved) && saved >= 0) bestScore = saved; } catch (e) {}

    // Reserve the actual frame padding, side rail, and controls before sizing the board.
    function updateBoardWidth() {
        const innerStyle = getComputedStyle(document.querySelector('.game-inner'));
        const layoutStyle = getComputedStyle(layoutEl);
        const railWidth = document.querySelector('.tetris-rail').getBoundingClientRect().width;
        const widthBudget = window.innerWidth - parseFloat(innerStyle.paddingLeft) - parseFloat(innerStyle.paddingRight) - railWidth - parseFloat(layoutStyle.columnGap);
        const heightBudget = (window.innerHeight - parseFloat(innerStyle.paddingTop) - parseFloat(innerStyle.paddingBottom) - 112) / 2;
        const boardW = Math.max(96, Math.floor(Math.min(widthBudget, heightBudget, 280)));
        mainEl.style.setProperty('--board-width', boardW + 'px');
        mainEl.style.width = boardW + 'px';
    }
    updateBoardWidth();

    function reset() {
        board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        score = 0;
        level = 1;
        lines = 0;
        current = null;
        next = null;
        dropCounter = 0;
        lastTime = 0;
        state = 'idle';
        if (rafId) cancelAnimationFrame(rafId);
        scoreEl.textContent = '0';
        updateLevelUI();
        btnStart.textContent = 'START';
        btnStart.disabled = false;
        btnPause.disabled = true;
        modal.classList.remove('show');
        draw();
        drawNext();
    }

    function updateLevelUI() {
        levelEl.textContent = `${level} / ${bestScore}`;
    }

    function dropInterval() {
        return Math.max(MIN_INTERVAL, BASE_INTERVAL - (level - 1) * 60);
    }

    function spawn() {
        current = next || nextFromBag();
        next = nextFromBag();
        drawNext();
        current.x = Math.floor((COLS - current.shape[0].length) / 2);
        current.y = 0;
        if (collide()) endGame();
    }

    function collide(shape, ox, oy) {
        shape = shape || (current && current.shape);
        if (!shape) return false;
        ox = (ox === undefined) ? current.x : ox;
        oy = (oy === undefined) ? current.y : oy;
        for (let y = 0; y < shape.length; y++) {
            for (let x = 0; x < shape[y].length; x++) {
                if (!shape[y][x]) continue;
                const bx = ox + x, by = oy + y;
                if (bx < 0 || bx >= COLS || by >= ROWS) return true;
                if (by >= 0 && board[by][bx]) return true;
            }
        }
        return false;
    }

    function merge() {
        current.shape.forEach((row, y) => {
            row.forEach((v, x) => {
                if (v && current.y + y >= 0) {
                    board[current.y + y][current.x + x] = current.color;
                }
            });
        });
        clearLines();
        spawn();
    }

    function clearLines() {
        let cleared = 0;
        for (let y = ROWS - 1; y >= 0; y--) {
            if (board[y].every(v => v !== 0)) {
                board.splice(y, 1);
                board.unshift(Array(COLS).fill(0));
                cleared++;
                y++;
            }
        }
        if (cleared > 0) {
            const points = [0, 100, 300, 500, 800];
            score += points[cleared] * level;
            lines += cleared;
            const newLevel = Math.floor(lines / 10) + 1;
            if (newLevel !== level) level = newLevel;
            scoreEl.textContent = score;
            updateLevelUI();
            if (score > bestScore) {
                bestScore = score;
                try { localStorage.setItem('tetrisBest', String(bestScore)); } catch (e) {}
                updateLevelUI();
            }
        }
    }

    function rotate() {
        if (!current || state !== 'running') return;
        const rotated = current.shape[0].map((_, i) => current.shape.map(r => r[i]).reverse());
        const oldShape = current.shape;
        const kicks = [0, -1, 1, -2, 2];
        for (const dx of kicks) {
            if (!collide(rotated, current.x + dx, current.y)) {
                current.shape = rotated;
                current.x += dx;
                draw();
                return;
            }
        }
        current.shape = oldShape;
    }

    function move(dx) {
        if (!current || state !== 'running') return;
        if (!collide(current.shape, current.x + dx, current.y)) {
            current.x += dx;
            draw();
        }
    }

    function softDrop() {
        if (!current || state !== 'running') return;
        if (!collide(current.shape, current.x, current.y + 1)) {
            current.y++;
        } else {
            merge();
        }
        dropCounter = 0;
        draw();
    }

    function hardDrop() {
        if (!current || state !== 'running') return;
        while (!collide(current.shape, current.x, current.y + 1)) current.y++;
        merge();
        dropCounter = 0;
        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, 240, 480);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 240, 480);

        ctx.strokeStyle = 'rgba(58, 74, 122, 0.35)';
        ctx.lineWidth = 1;
        for (let i = 1; i < COLS; i++) {
            ctx.beginPath();
            ctx.moveTo(i * BLOCK + 0.5, 0);
            ctx.lineTo(i * BLOCK + 0.5, 480);
            ctx.stroke();
        }
        for (let i = 1; i < ROWS; i++) {
            ctx.beginPath();
            ctx.moveTo(0, i * BLOCK + 0.5);
            ctx.lineTo(240, i * BLOCK + 0.5);
            ctx.stroke();
        }

        board.forEach((row, y) => row.forEach((c, x) => { if (c) drawBlock(x, y, c); }));
        if (current) {
            current.shape.forEach((row, y) => row.forEach((v, x) => {
                if (v) drawBlock(current.x + x, current.y + y, current.color);
            }));
        }
    }

    function drawBlock(x, y, color) {
        const px = x * BLOCK, py = y * BLOCK;
        const S = BLOCK;
        ctx.fillStyle = color;
        ctx.fillRect(px, py, S, S);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.fillRect(px, py, S, 3);
        ctx.fillRect(px, py, 3, S);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.fillRect(px, py + S - 3, S, 3);
        ctx.fillRect(px + S - 3, py, 3, S);

        ctx.strokeStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 0.5, py + 0.5, S - 1, S - 1);
    }

    function drawNext() {
        nextCtx.clearRect(0, 0, 120, 120);
        nextCtx.fillStyle = '#000';
        nextCtx.fillRect(0, 0, 120, 120);
        if (!next) return;
        const shape = next.shape;
        const bs = 24;
        const ox = (120 - shape[0].length * bs) / 2;
        const oy = (120 - shape.length * bs) / 2;
        shape.forEach((row, y) => row.forEach((v, x) => {
            if (!v) return;
            const px = ox + x * bs, py = oy + y * bs;
            nextCtx.fillStyle = next.color;
            nextCtx.fillRect(px, py, bs - 2, bs - 2);
            nextCtx.fillStyle = 'rgba(255, 255, 255, 0.55)';
            nextCtx.fillRect(px, py, bs - 2, 3);
            nextCtx.fillRect(px, py, 3, bs - 2);
            nextCtx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            nextCtx.fillRect(px, py + bs - 5, bs - 2, 3);
            nextCtx.fillRect(px + bs - 5, py, 3, bs - 2);
            nextCtx.strokeStyle = 'rgba(0, 0, 0, 0.85)';
            nextCtx.lineWidth = 1;
            nextCtx.strokeRect(px + 0.5, py + 0.5, bs - 3, bs - 3);
        }));
    }

    function loop(time = 0) {
        if (state !== 'running') return;
        if (!lastTime) lastTime = time;
        const dt = time - lastTime;
        lastTime = time;
        dropCounter += dt;
        if (dropCounter > dropInterval()) softDrop();
        draw();
        if (state === 'running') rafId = requestAnimationFrame(loop);
    }

    function start() {
        reset();
        state = 'running';
        next = nextFromBag();
        spawn();
        lastTime = 0;
        dropCounter = 0;
        rafId = requestAnimationFrame(loop);
        btnStart.textContent = 'RESTART';
        btnPause.disabled = false;
    }

    function pause() {
        if (state === 'running') {
            state = 'paused';
            if (rafId) cancelAnimationFrame(rafId);
            showModal('PAUSED', '点击继续继续游戏', 'RESUME', 'CLOSE');
            btnRestart.onclick = resume;
            btnLeave.onclick = () => { modal.classList.remove('show'); leave(); };
        }
    }
    function resume() {
        if (state !== 'paused') return;
        modal.classList.remove('show');
        state = 'running';
        lastTime = 0;
        dropCounter = 0;
        rafId = requestAnimationFrame(loop);
    }

    function endGame() {
        state = 'over';
        if (rafId) cancelAnimationFrame(rafId);
        showModal('GAME OVER', 'FINAL SCORE', 'RESTART', 'CLOSE', score);
        btnRestart.onclick = start;
        btnLeave.onclick = () => { modal.classList.remove('show'); leave(); };
    }

    function showModal(title, sub, restartText, leaveText, bigValue) {
        modalTitle.textContent = title;
        modalSub.innerHTML = sub + '<span class="big-value" id="finalScore"></span>';
        const el = modalSub.querySelector('#finalScore');
        if (bigValue !== null && bigValue !== undefined) el.textContent = bigValue;
        btnRestart.textContent = restartText;
        btnLeave.textContent = leaveText;
        modal.classList.add('show');
    }

    function leave() {
        modal.classList.remove('show');
        reset();
    }

    btnStart.onclick = start;
    btnRotate.addEventListener('click', rotate);
    btnPause.addEventListener('click', pause);
    btnRestart.addEventListener('click', start);
    btnLeave.addEventListener('click', leave);

    touchControls.addEventListener('click', (e) => {
        const btn = e.target.closest('.px-touch-btn');
        if (!btn) return;
        const action = btn.dataset.action;
        if (action === 'left') move(-1);
        else if (action === 'right') move(1);
        else if (action === 'down') softDrop();
        else if (action === 'rotate') rotate();
    });

    let touchStartX = 0, touchStartY = 0, touchMoved = false;
    canvas.addEventListener('touchstart', (e) => {
        if (state !== 'running') return;
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        touchMoved = false;
    }, { passive: true });
    canvas.addEventListener('touchmove', (e) => {
        if (state !== 'running') return;
        const t = e.touches[0];
        const dx = t.clientX - touchStartX;
        const dy = t.clientY - touchStartY;
        const threshold = 30;
        if (Math.abs(dx) > threshold && Math.abs(dx) > Math.abs(dy)) {
            move(dx > 0 ? 1 : -1);
            touchStartX = t.clientX;
            touchMoved = true;
        } else if (dy > threshold) {
            softDrop();
            touchStartY = t.clientY;
            touchMoved = true;
        }
    }, { passive: true });
    canvas.addEventListener('touchend', () => {
        if (state !== 'running') return;
        if (!touchMoved) rotate();
    });

    document.addEventListener('keydown', e => {
        if (e.key === 'p' || e.key === 'P') {
            e.preventDefault();
            if (state === 'running') pause();
            else if (state === 'paused') resume();
            return;
        }
        if (state !== 'running') return;
        const keys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '];
        if (keys.includes(e.key)) e.preventDefault();
        if (e.repeat && ['ArrowUp', ' '].includes(e.key)) return;
        switch (e.key) {
            case 'ArrowLeft': move(-1); break;
            case 'ArrowRight': move(1); break;
            case 'ArrowDown': softDrop(); break;
            case 'ArrowUp': rotate(); break;
            case ' ': hardDrop(); break;
        }
    });

    GameBridge.onParentMessage((msg) => {
        if (msg.type === 'pause' && state === 'running') pause();
    });

    GameBridge.onVisibilityChange((hidden) => {
        if (hidden && state === 'running') pause();
    });

    // 视口变化时重算主区宽度
    let resizeTimer = null;
    window.addEventListener('resize', () => {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(updateBoardWidth, 100);
    });

    reset();
})();
</script>
</body>
</html>
