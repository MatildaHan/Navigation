<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>古诗词背诵</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.poetry-wrap {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px;
    box-sizing: border-box;
    min-height: 100%;
}
.poetry-card {
    background: rgba(255, 250, 240, 0.92);
    border: 1px solid rgba(44, 44, 44, 0.2);
    border-radius: 2px;
    box-shadow: inset 0 0 20px rgba(180, 160, 120, 0.15);
    padding: 32px 24px;
    text-align: center;
}
.poetry-dynasty {
    font-size: 13px;
    color: #8A7A60;
    letter-spacing: 4px;
    margin-bottom: 6px;
}
.poetry-name {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #1A1A1A;
    font-family: "KaiTi", "STKaiti", serif;
}
.poetry-author {
    font-size: 14px;
    color: #6A6050;
    letter-spacing: 3px;
    margin-bottom: 20px;
}
.poetry-content {
    font-size: 18px;
    line-height: 2.2;
    letter-spacing: 4px;
    color: #2C2C2C;
    font-family: "KaiTi", "STKaiti", serif;
    white-space: pre-line;
}
.poetry-picker {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
    color: var(--text-sub);
    font-size: 13px;
}
.poetry-select {
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #233232;
    color: var(--text);
    font: inherit;
}
.poetry-preface {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-sub);
    margin-bottom: 12px;
}
.poetry-preface summary { cursor: pointer; }
.poetry-preface[open] > div { margin-top: 6px; }
.poetry-card:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
.poetry-content, .poetry-name { overflow-wrap: anywhere; }
@media (max-width: 600px) {
    .poetry-content { font-size: 17px; letter-spacing: 2px; }
    .poetry-name { font-size: 22px; letter-spacing: 2px; }
}
@media (max-height: 360px) {
    .game-inner > .poetry-wrap { gap: 8px; }
    .game-inner > .poetry-wrap .poetry-card { min-height: 140px; }
}
.poetry-controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 8px;
}
.poetry-btn {
    background: transparent;
    color: #2C2C2C;
    border: 1.5px solid #4A4A4A;
    padding: 10px 24px;
    border-radius: 2px;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 3px;
    cursor: pointer;
    min-height: 44px;
    transition: all 0.15s;
}
.poetry-btn:hover { background: rgba(44, 44, 44, 0.06); }
.poetry-hint {
    text-align: center;
    font-size: 12px;
    color: #A89A80;
    letter-spacing: 2px;
}
.poetry-hint b { color: #B83B3B; }
</style>
<link rel="stylesheet" href="../../assets/css/apps.css">
</head>
<body class="embedded">
<div class="game-inner">
    <div class="poetry-wrap">
        <label class="poetry-picker" for="poemSelect">
            选择篇目
            <select class="poetry-select" id="poemSelect"></select>
        </label>
        <div class="poetry-card" id="poemCard" tabindex="0" role="region" aria-labelledby="title">
            <div class="poetry-dynasty" id="dynasty">—</div>
            <div class="poetry-name" id="title">—</div>
            <div class="poetry-author" id="author">—</div>
            <details class="poetry-preface" id="prefaceBlock" hidden>
                <summary>小序</summary>
                <div id="preface"></div>
            </details>
            <div class="poetry-content" id="content">—</div>
        </div>
        <div class="poetry-controls">
            <button class="poetry-btn" id="btnPrev">上一首</button>
            <button class="poetry-btn" id="btnNext">下一首</button>
        </div>
        <div class="poetry-hint" role="status">第 <b id="idx">1</b> / <b id="total">0</b> 首 · <span id="currentPoem"></span></div>
    </div>
</div>

<script src="../js/bridge.js"></script>
<script src="../data/poetry-library.js"></script>
<script src="../../assets/js/app-common.js" defer></script>
<script>
(function () {
    'use strict';
    document.body.classList.add('embedded');
    GameBridge.notifyReady();

    const POEMS = POETRY_LIBRARY;

    let idx = 0;
    const dynastyEl = document.getElementById('dynasty');
    const titleEl = document.getElementById('title');
    const authorEl = document.getElementById('author');
    const contentEl = document.getElementById('content');
    const prefaceEl = document.getElementById('preface');
    const prefaceBlock = document.getElementById('prefaceBlock');
    const idxEl = document.getElementById('idx');
    const totalEl = document.getElementById('total');

    const selectEl = document.getElementById('poemSelect');
    const cardEl = document.getElementById('poemCard');
    const currentPoemEl = document.getElementById('currentPoem');

    const groups = new Map();
    POEMS.forEach((poem, index) => {
        if (!groups.has(poem.dynasty)) {
            const group = document.createElement('optgroup');
            group.label = poem.dynasty === '唐' ? '唐诗' : poem.dynasty === '宋' ? '宋代诗词' : poem.dynasty;
            groups.set(poem.dynasty, group);
            selectEl.appendChild(group);
        }
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = `${poem.title} · ${poem.dynasty} · ${poem.author}`;
        groups.get(poem.dynasty).appendChild(option);
    });
    totalEl.textContent = POEMS.length;

    function render() {
        const p = POEMS[idx];
        dynastyEl.textContent = `〔${p.dynasty}〕`;
        titleEl.textContent = p.title;
        authorEl.textContent = p.author;
        prefaceEl.textContent = p.preface || '';
        prefaceBlock.hidden = !p.preface;
        prefaceBlock.open = false;
        contentEl.textContent = p.lines.join('\n');
        cardEl.scrollTop = 0;
        selectEl.value = String(idx);
        idxEl.textContent = idx + 1;
        currentPoemEl.textContent = `${p.title} · ${p.author}`;
    }

    selectEl.addEventListener('change', () => {
        const next = Number(selectEl.value);
        if (!Number.isInteger(next) || next < 0 || next >= POEMS.length) return;
        idx = next;
        render();
    });
    document.getElementById('btnPrev').onclick = () => {
        idx = (idx - 1 + POEMS.length) % POEMS.length;
        render();
    };
    document.getElementById('btnNext').onclick = () => {
        idx = (idx + 1) % POEMS.length;
        render();
    };

    render();
})();
</script>
</body>
</html>
