<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>古诗词背诵</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.poetry-wrap {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px;
    box-sizing: border-box;
    min-height: 100%;
}
.poetry-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 6px;
    text-align: center;
    color: #1A1A1A;
}
.poetry-subtitle {
    font-size: 13px;
    color: #8A7A60;
    letter-spacing: 4px;
    text-align: center;
    margin-bottom: 8px;
}
.poetry-card {
    background: rgba(255, 250, 240, 0.92);
    border: 1px solid rgba(44, 44, 44, 0.2);
    border-radius: 2px;
    box-shadow: inset 0 0 20px rgba(180, 160, 120, 0.15);
    padding: 32px 24px;
    text-align: center;
}
.poetry-dynasty {
    font-size: 13px;
    color: #8A7A60;
    letter-spacing: 4px;
    margin-bottom: 6px;
}
.poetry-name {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #1A1A1A;
    font-family: "KaiTi", "STKaiti", serif;
}
.poetry-author {
    font-size: 14px;
    color: #6A6050;
    letter-spacing: 3px;
    margin-bottom: 20px;
}
.poetry-content {
    font-size: 18px;
    line-height: 2.2;
    letter-spacing: 4px;
    color: #2C2C2C;
    font-family: "KaiTi", "STKaiti", serif;
    white-space: pre-line;
}
.poetry-picker {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
    color: var(--text-sub);
    font-size: 13px;
}
.poetry-select {
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #233232;
    color: var(--text);
    font: inherit;
}
.poetry-preface {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-sub);
    margin-bottom: 12px;
}
.poetry-card:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
.poetry-content, .poetry-name { overflow-wrap: anywhere; }
@media (max-width: 600px) {
    .poetry-content { font-size: 17px; letter-spacing: 2px; }
    .poetry-name { font-size: 22px; letter-spacing: 2px; }
    .poetry-subtitle { letter-spacing: 1px; }
}
@media (max-height: 360px) {
    .game-inner > .poetry-wrap { gap: 8px; }
    .poetry-subtitle { display: none; }
    .game-inner > .poetry-wrap .poetry-card { min-height: 140px; }
}
.poetry-controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 8px;
}
.poetry-btn {
    background: transparent;
    color: #2C2C2C;
    border: 1.5px solid #4A4A4A;
    padding: 10px 24px;
    border-radius: 2px;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 3px;
    cursor: pointer;
    min-height: 44px;
    transition: all 0.15s;
}
.poetry-btn:hover { background: rgba(44, 44, 44, 0.06); }
.poetry-hint {
    text-align: center;
    font-size: 12px;
    color: #A89A80;
    letter-spacing: 2px;
}
.poetry-hint b { color: #B83B3B; }
</style>
<link rel="stylesheet" href="../../assets/css/apps.css">
</head>
<body class="embedded">
<div class="game-inner">
    <div class="poetry-wrap">
        <div>
            <div class="poetry-title">古 诗 词</div>
            <div class="poetry-subtitle">经典篇目 · 查看全文 · 线下背诵</div>
        </div>
        <label class="poetry-picker" for="poemSelect">
            选择篇目
            <select class="poetry-select" id="poemSelect"></select>
        </label>
        <div class="poetry-card" id="poemCard" tabindex="0" role="region" aria-labelledby="title">
            <div class="poetry-dynasty" id="dynasty">—</div>
            <div class="poetry-name" id="title">—</div>
            <div class="poetry-author" id="author">—</div>
            <div class="poetry-preface" id="preface" hidden></div>
            <div class="poetry-content" id="content">—</div>
        </div>
        <div class="poetry-controls">
            <button class="poetry-btn" id="btnPrev">上一首</button>
            <button class="poetry-btn" id="btnNext">下一首</button>
        </div>
        <div class="poetry-hint" role="status">第 <b id="idx">1</b> / <b id="total">0</b> 首 · <span id="currentPoem"></span></div>
    </div>
</div>

<script src="../js/bridge.js"></script>
<script src="../../assets/js/app-common.js" defer></script>
<script>
(function () {
    'use strict';
    document.body.classList.add('embedded');
    GameBridge.notifyReady();

    const POEMS = [
        {
            dynasty: '唐', title: '静夜思', author: '李白',
            lines: ['床前明月光，', '疑是地上霜。', '举头望明月，', '低头思故乡。']
        },
        {
            dynasty: '唐', title: '登鹳雀楼', author: '王之涣',
            lines: ['白日依山尽，', '黄河入海流。', '欲穷千里目，', '更上一层楼。']
        },
        {
            dynasty: '唐', title: '春晓', author: '孟浩然',
            lines: ['春眠不觉晓，', '处处闻啼鸟。', '夜来风雨声，', '花落知多少。']
        },
        {
            dynasty: '唐', title: '相思', author: '王维',
            lines: ['红豆生南国，', '春来发几枝。', '愿君多采撷，', '此物最相思。']
        },
        {
            dynasty: '唐', title: '江雪', author: '柳宗元',
            lines: ['千山鸟飞绝，', '万径人踪灭。', '孤舟蓑笠翁，', '独钓寒江雪。']
        },
        {
            dynasty: '唐', title: '悯农·其二', author: '李绅',
            lines: ['锄禾日当午，', '汗滴禾下土。', '谁知盘中餐，', '粒粒皆辛苦。']
        },
        {
            dynasty: '唐', title: '咏鹅', author: '骆宾王',
            lines: ['鹅，鹅，鹅，', '曲项向天歌。', '白毛浮绿水，', '红掌拨清波。']
        },
        {
            dynasty: '唐', title: '望庐山瀑布', author: '李白',
            lines: ['日照香炉生紫烟，', '遥看瀑布挂前川。', '飞流直下三千尺，', '疑是银河落九天。']
        },
        {
            dynasty: '唐', title: '绝句', author: '杜甫',
            lines: ['两个黄鹂鸣翠柳，', '一行白鹭上青天。', '窗含西岭千秋雪，', '门泊东吴万里船。']
        },
        {
            dynasty: '宋', title: '水调歌头·明月几时有', author: '苏轼',
            preface: '丙辰中秋，欢饮达旦，大醉，作此篇，兼怀子由。',
            lines: [
                '明月几时有？把酒问青天。',
                '不知天上宫阙，今夕是何年。',
                '我欲乘风归去，又恐琼楼玉宇，高处不胜寒。',
                '起舞弄清影，何似在人间。',
                '转朱阁，低绮户，照无眠。',
                '不应有恨，何事长向别时圆？',
                '人有悲欢离合，月有阴晴圆缺，此事古难全。',
                '但愿人长久，千里共婵娟。'
            ]
        },
        {
            dynasty: '宋', title: '如梦令·常记溪亭日暮', author: '李清照',
            lines: ['常记溪亭日暮，', '沉醉不知归路。', '兴尽晚回舟，', '误入藕花深处。', '争渡，争渡，', '惊起一滩鸥鹭。']
        },
        {
            dynasty: '元', title: '天净沙·秋思', author: '马致远',
            lines: ['枯藤老树昏鸦，', '小桥流水人家，', '古道西风瘦马。', '夕阳西下，', '断肠人在天涯。']
        },
        {
            dynasty: '唐', title: '春望', author: '杜甫',
            lines: ['国破山河在，', '城春草木深。', '感时花溅泪，', '恨别鸟惊心。', '烽火连三月，', '家书抵万金。', '白头搔更短，', '浑欲不胜簪。']
        },
        {
            dynasty: '唐', title: '山行', author: '杜牧',
            lines: ['远上寒山石径斜，', '白云生处有人家。', '停车坐爱枫林晚，', '霜叶红于二月花。']
        },
        {
            dynasty: '宋', title: '饮湖上初晴后雨·其二', author: '苏轼',
            lines: ['水光潋滟晴方好，', '山色空蒙雨亦奇。', '欲把西湖比西子，', '淡妆浓抹总相宜。']
        },
        {
            dynasty: '宋', title: '题西林壁', author: '苏轼',
            lines: ['横看成岭侧成峰，', '远近高低各不同。', '不识庐山真面目，', '只缘身在此山中。']
        },
        {
            dynasty: '宋', title: '游山西村', author: '陆游',
            lines: ['莫笑农家腊酒浑，', '丰年留客足鸡豚。', '山重水复疑无路，', '柳暗花明又一村。', '箫鼓追随春社近，', '衣冠简朴古风存。', '从今若许闲乘月，', '拄杖无时夜叩门。']
        },
        {
            dynasty: '宋', title: '西江月·夜行黄沙道中', author: '辛弃疾',
            lines: ['明月别枝惊鹊，', '清风半夜鸣蝉。', '稻花香里说丰年，', '听取蛙声一片。', '七八个星天外，', '两三点雨山前。', '旧时茅店社林边，', '路转溪桥忽见。']
        }
    ];

    let idx = 0;
    const dynastyEl = document.getElementById('dynasty');
    const titleEl = document.getElementById('title');
    const authorEl = document.getElementById('author');
    const contentEl = document.getElementById('content');
    const prefaceEl = document.getElementById('preface');
    const idxEl = document.getElementById('idx');
    const totalEl = document.getElementById('total');

    const selectEl = document.getElementById('poemSelect');
    const cardEl = document.getElementById('poemCard');
    const currentPoemEl = document.getElementById('currentPoem');

    POEMS.forEach((poem, index) => {
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = `${poem.title} · ${poem.dynasty} · ${poem.author}`;
        selectEl.appendChild(option);
    });
    totalEl.textContent = POEMS.length;

    function render() {
        const p = POEMS[idx];
        dynastyEl.textContent = `〔${p.dynasty}〕`;
        titleEl.textContent = p.title;
        authorEl.textContent = p.author;
        prefaceEl.textContent = p.preface || '';
        prefaceEl.hidden = !p.preface;
        contentEl.textContent = p.lines.join('\n');
        cardEl.scrollTop = 0;
        selectEl.value = String(idx);
        idxEl.textContent = idx + 1;
        currentPoemEl.textContent = `${p.title} · ${p.author}`;
    }

    selectEl.addEventListener('change', () => {
        const next = Number(selectEl.value);
        if (!Number.isInteger(next) || next < 0 || next >= POEMS.length) return;
        idx = next;
        render();
    });
    document.getElementById('btnPrev').onclick = () => {
        idx = (idx - 1 + POEMS.length) % POEMS.length;
        render();
    };
    document.getElementById('btnNext').onclick = () => {
        idx = (idx + 1) % POEMS.length;
        render();
    };

    render();
})();
</script>
</body>
</html>
