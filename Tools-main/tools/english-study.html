<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>英语学习</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.en-wrap {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px;
    box-sizing: border-box;
    min-height: 100%;
}
.en-subtitle {
    font-size: 13px;
    color: #8A7A60;
    letter-spacing: 3px;
    text-align: center;
    margin-bottom: 8px;
}
.en-card {
    background: rgba(255, 250, 240, 0.9);
    border: 1px solid rgba(44, 44, 44, 0.2);
    border-radius: 2px;
    box-shadow: inset 0 0 20px rgba(180, 160, 120, 0.15);
    padding: 24px;
    text-align: center;
}
.en-word {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #1A1A1A;
    font-family: Georgia, serif;
    overflow-wrap: anywhere;
}
.en-phonetic {
    font-size: 14px;
    color: #8A7A60;
    margin-top: 6px;
    font-family: "Courier New", monospace;
    letter-spacing: 1px;
}
.en-pos {
    display: inline-block;
    background: rgba(184, 59, 59, 0.1);
    color: #B83B3B;
    padding: 2px 10px;
    border-radius: 2px;
    font-size: 12px;
    margin-top: 8px;
    letter-spacing: 2px;
}
.en-meaning {
    font-size: 16px;
    color: #2C2C2C;
    margin-top: 16px;
    letter-spacing: 2px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}
.en-example {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px dashed rgba(44, 44, 44, 0.2);
    font-size: 14px;
    color: #4A4A4A;
    line-height: 1.7;
    font-style: italic;
}
.en-example .en {
    color: #1A1A1A;
}
.en-example .zh {
    color: #8A7A60;
    margin-top: 4px;
    font-style: normal;
    font-size: 13px;
}
.en-controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 16px;
}
.en-btn {
    background: transparent;
    color: #2C2C2C;
    border: 1.5px solid #4A4A4A;
    padding: 10px 24px;
    border-radius: 2px;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 3px;
    cursor: pointer;
    min-height: 44px;
    transition: all 0.15s;
}
.en-btn:hover { background: rgba(44, 44, 44, 0.06); }
.en-btn.primary {
    background: #B83B3B;
    color: #F5EFE0;
    border-color: #8B2A2A;
}
.en-btn.primary:hover { background: #8B2A2A; }
.en-progress {
    text-align: center;
    font-size: 13px;
    color: #8A7A60;
    letter-spacing: 2px;
}
.en-progress b { color: #B83B3B; font-size: 16px; }
</style>
<link rel="stylesheet" href="../../assets/css/apps.css">
</head>
<body class="embedded">
<div class="game-inner">
    <div class="en-wrap">
        <div>
            <div class="en-subtitle">大学英语四级 · CET-4 词库</div>
        </div>
        <div class="en-card">
            <div class="en-word" id="word">—</div>
            <div class="en-phonetic" id="phonetic">—</div>
            <div class="en-pos" id="pos">—</div>
            <div class="en-meaning" id="meaning">—</div>
            <div class="en-example">
                <div class="en" id="exampleEn"></div>
                <div class="zh" id="exampleZh"></div>
            </div>
        </div>
        <div class="en-controls">
            <button class="en-btn" id="btnPrev">上一词</button>
            <button class="en-btn primary" id="btnSpeak">🔊 发音</button>
            <button class="en-btn" id="btnNext">下一词</button>
        </div>
        <div class="en-progress">
            第 <b id="idx">1</b> / <b id="total">0</b> 词
        </div>
    </div>
</div>

<script src="../js/bridge.js"></script>
<script src="../data/cet4-vocabulary.js"></script>
<script src="../../assets/js/app-common.js" defer></script>
<script>
(function () {
    'use strict';
    document.body.classList.add('embedded');
    GameBridge.notifyReady();

    const WORDS = CET4_VOCABULARY;

    let idx = 0;
    const wordEl = document.getElementById('word');
    const phoneticEl = document.getElementById('phonetic');
    const posEl = document.getElementById('pos');
    const meaningEl = document.getElementById('meaning');
    const exampleEnEl = document.getElementById('exampleEn');
    const exampleZhEl = document.getElementById('exampleZh');
    const idxEl = document.getElementById('idx');
    const totalEl = document.getElementById('total');

    function render() {
        const w = WORDS[idx];
        wordEl.textContent = w.word;
        phoneticEl.textContent = w.phonetic;
        phoneticEl.hidden = !w.phonetic;
        posEl.textContent = w.pos;
        posEl.hidden = !w.pos;
        meaningEl.textContent = w.meaning;
        exampleEnEl.textContent = w.en || '';
        exampleZhEl.textContent = w.zh || '';
        exampleEnEl.parentElement.hidden = !w.en;
        idxEl.textContent = idx + 1;
        totalEl.textContent = WORDS.length;
    }

    function speak() {
        if ('speechSynthesis' in window) {
            const u = new SpeechSynthesisUtterance(WORDS[idx].word);
            u.lang = 'en-US';
            u.rate = 0.9;
            GameBridge.notifyActive();
            speechSynthesis.cancel();
            speechSynthesis.speak(u);
        }
    }

    document.getElementById('btnPrev').onclick = () => {
        idx = (idx - 1 + WORDS.length) % WORDS.length;
        render();
    };
    document.getElementById('btnNext').onclick = () => {
        idx = (idx + 1) % WORDS.length;
        render();
    };
    document.getElementById('btnSpeak').onclick = speak;
    if (!('speechSynthesis' in window)) { document.getElementById('btnSpeak').disabled = true; document.getElementById('btnSpeak').textContent = '浏览器不支持朗读'; }

    render();
})();
</script>
</body>
</html>
