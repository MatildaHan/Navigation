<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>英语学习</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.en-wrap {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px;
    box-sizing: border-box;
    min-height: 100%;
}
.en-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 4px;
    text-align: center;
    color: #1A1A1A;
}
.en-subtitle {
    font-size: 13px;
    color: #8A7A60;
    letter-spacing: 3px;
    text-align: center;
    margin-bottom: 8px;
}
.en-card {
    background: rgba(255, 250, 240, 0.9);
    border: 1px solid rgba(44, 44, 44, 0.2);
    border-radius: 2px;
    box-shadow: inset 0 0 20px rgba(180, 160, 120, 0.15);
    padding: 24px;
    text-align: center;
}
.en-word {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #1A1A1A;
    font-family: Georgia, serif;
}
.en-phonetic {
    font-size: 14px;
    color: #8A7A60;
    margin-top: 6px;
    font-family: "Courier New", monospace;
    letter-spacing: 1px;
}
.en-pos {
    display: inline-block;
    background: rgba(184, 59, 59, 0.1);
    color: #B83B3B;
    padding: 2px 10px;
    border-radius: 2px;
    font-size: 12px;
    margin-top: 8px;
    letter-spacing: 2px;
}
.en-meaning {
    font-size: 16px;
    color: #2C2C2C;
    margin-top: 16px;
    letter-spacing: 2px;
    line-height: 1.6;
}
.en-example {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px dashed rgba(44, 44, 44, 0.2);
    font-size: 14px;
    color: #4A4A4A;
    line-height: 1.7;
    font-style: italic;
}
.en-example .en {
    color: #1A1A1A;
}
.en-example .zh {
    color: #8A7A60;
    margin-top: 4px;
    font-style: normal;
    font-size: 13px;
}
.en-controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 16px;
}
.en-btn {
    background: transparent;
    color: #2C2C2C;
    border: 1.5px solid #4A4A4A;
    padding: 10px 24px;
    border-radius: 2px;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 3px;
    cursor: pointer;
    min-height: 44px;
    transition: all 0.15s;
}
.en-btn:hover { background: rgba(44, 44, 44, 0.06); }
.en-btn.primary {
    background: #B83B3B;
    color: #F5EFE0;
    border-color: #8B2A2A;
}
.en-btn.primary:hover { background: #8B2A2A; }
.en-progress {
    text-align: center;
    font-size: 13px;
    color: #8A7A60;
    letter-spacing: 2px;
}
.en-progress b { color: #B83B3B; font-size: 16px; }
</style>
<link rel="stylesheet" href="../../assets/css/apps.css">
</head>
<body class="embedded">
<div class="game-inner">
    <div class="en-wrap">
        <div>
            <div class="en-title">英 语 学 习</div>
            <div class="en-subtitle">ENGLISH VOCABULARY</div>
        </div>
        <div class="en-card">
            <div class="en-word" id="word">—</div>
            <div class="en-phonetic" id="phonetic">—</div>
            <div class="en-pos" id="pos">—</div>
            <div class="en-meaning" id="meaning">—</div>
            <div class="en-example">
                <div class="en" id="exampleEn"></div>
                <div class="zh" id="exampleZh"></div>
            </div>
        </div>
        <div class="en-controls">
            <button class="en-btn" id="btnPrev">上一词</button>
            <button class="en-btn primary" id="btnSpeak">🔊 发音</button>
            <button class="en-btn" id="btnNext">下一词</button>
        </div>
        <div class="en-progress">
            第 <b id="idx">1</b> / <b id="total">0</b> 词
        </div>
    </div>
</div>

<script src="../js/bridge.js"></script>
<script src="../../assets/js/app-common.js" defer></script>
<script>
(function () {
    'use strict';
    document.body.classList.add('embedded');
    GameBridge.notifyReady();

    const WORDS = [
        { word: 'abundant', phonetic: '/əˈbʌndənt/', pos: 'adj.', meaning: '丰富的，充裕的', en: 'The region has abundant natural resources.', zh: '该地区自然资源丰富。' },
        { word: 'benefit', phonetic: '/ˈbenɪfɪt/', pos: 'n./v.', meaning: '好处；有益于', en: 'Regular exercise benefits your health.', zh: '定期锻炼有益于健康。' },
        { word: 'comprehensive', phonetic: '/ˌkɒmprɪˈhensɪv/', pos: 'adj.', meaning: '全面的，综合的', en: 'She gave a comprehensive report.', zh: '她做了一份全面的报告。' },
        { word: 'diligent', phonetic: '/ˈdɪlɪdʒənt/', pos: 'adj.', meaning: '勤奋的，用功的', en: 'He is a diligent student.', zh: '他是一个勤奋的学生。' },
        { word: 'efficient', phonetic: '/ɪˈfɪʃnt/', pos: 'adj.', meaning: '高效的，效率高的', en: 'This is a more efficient method.', zh: '这是一种更高效的方法。' },
        { word: 'fundamental', phonetic: '/ˌfʌndəˈmentl/', pos: 'adj.', meaning: '基本的，根本的', en: 'Reading is a fundamental skill.', zh: '阅读是一项基本技能。' },
        { word: 'generate', phonetic: '/ˈdʒenəreɪt/', pos: 'v.', meaning: '产生，引起', en: 'The project will generate new jobs.', zh: '该项目将创造新的就业机会。' },
        { word: 'hypothesis', phonetic: '/haɪˈpɒθəsɪs/', pos: 'n.', meaning: '假设，假说', en: 'The experiment tested the hypothesis.', zh: '实验检验了这个假设。' },
        { word: 'implement', phonetic: '/ˈɪmplɪment/', pos: 'v.', meaning: '实施，执行', en: 'We will implement the plan next week.', zh: '我们下周将实施该计划。' },
        { word: 'justify', phonetic: '/ˈdʒʌstɪfaɪ/', pos: 'v.', meaning: '证明…正当', en: 'Nothing can justify such behavior.', zh: '没有什么可以为这种行为辩护。' },
        { word: 'knowledge', phonetic: '/ˈnɒlɪdʒ/', pos: 'n.', meaning: '知识，学识', en: 'Knowledge is power.', zh: '知识就是力量。' },
        { word: 'maintain', phonetic: '/meɪnˈteɪn/', pos: 'v.', meaning: '维持，保持', en: 'It is important to maintain good habits.', zh: '保持良好习惯很重要。' },
        { word: 'negotiate', phonetic: '/nɪˈɡəʊʃieɪt/', pos: 'v.', meaning: '谈判，协商', en: 'They are negotiating a new contract.', zh: '他们正在协商一份新合同。' },
        { word: 'obvious', phonetic: '/ˈɒbviəs/', pos: 'adj.', meaning: '明显的，显然的', en: 'The answer is obvious.', zh: '答案很明显。' },
        { word: 'perspective', phonetic: '/pəˈspektɪv/', pos: 'n.', meaning: '观点，视角', en: 'Try to see it from my perspective.', zh: '试着从我的角度看。' },
        { word: 'qualify', phonetic: '/ˈkwɒlɪfaɪ/', pos: 'v.', meaning: '使合格；取得资格', en: 'She qualified as a doctor last year.', zh: '她去年取得了医生资格。' },
        { word: 'reliable', phonetic: '/rɪˈlaɪəbl/', pos: 'adj.', meaning: '可靠的，可信赖的', en: 'He is a reliable friend.', zh: '他是一个可靠的朋友。' },
        { word: 'significant', phonetic: '/sɪɡˈnɪfɪkənt/', pos: 'adj.', meaning: '重要的，显著的', en: 'This is a significant improvement.', zh: '这是一个显著的改进。' },
        { word: 'tremendous', phonetic: '/trəˈmendəs/', pos: 'adj.', meaning: '巨大的，极大的', en: 'She has tremendous talent.', zh: '她有极大的天赋。' },
        { word: 'utilize', phonetic: '/ˈjuːtəlaɪz/', pos: 'v.', meaning: '利用，使用', en: 'We should utilize every opportunity.', zh: '我们应该利用每一个机会。' }
    ];

    let idx = 0;
    const wordEl = document.getElementById('word');
    const phoneticEl = document.getElementById('phonetic');
    const posEl = document.getElementById('pos');
    const meaningEl = document.getElementById('meaning');
    const exampleEnEl = document.getElementById('exampleEn');
    const exampleZhEl = document.getElementById('exampleZh');
    const idxEl = document.getElementById('idx');
    const totalEl = document.getElementById('total');

    function render() {
        const w = WORDS[idx];
        wordEl.textContent = w.word;
        phoneticEl.textContent = w.phonetic;
        posEl.textContent = w.pos;
        meaningEl.textContent = w.meaning;
        exampleEnEl.textContent = w.en;
        exampleZhEl.textContent = w.zh;
        idxEl.textContent = idx + 1;
        totalEl.textContent = WORDS.length;
    }

    function speak() {
        if ('speechSynthesis' in window) {
            const u = new SpeechSynthesisUtterance(WORDS[idx].word);
            u.lang = 'en-US';
            u.rate = 0.9;
            GameBridge.notifyActive();
            speechSynthesis.cancel();
            speechSynthesis.speak(u);
        }
    }

    document.getElementById('btnPrev').onclick = () => {
        idx = (idx - 1 + WORDS.length) % WORDS.length;
        render();
    };
    document.getElementById('btnNext').onclick = () => {
        idx = (idx + 1) % WORDS.length;
        render();
    };
    document.getElementById('btnSpeak').onclick = speak;
    if (!('speechSynthesis' in window)) { document.getElementById('btnSpeak').disabled = true; document.getElementById('btnSpeak').textContent = '浏览器不支持朗读'; }

    render();
})();
</script>
</body>
</html>
