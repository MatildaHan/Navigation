<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>历史事件</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../../assets/css/apps.css">
<link rel="stylesheet" href="../css/history-events.css">
</head>
<body class="embedded">
<main class="game-inner">
    <div class="hist-wrap">
        <section id="catalog" aria-label="历史事件目录" hidden>
            <nav class="hist-filter" id="filter" aria-label="按历史时期筛选"></nav>
            <p class="hist-count" id="count" role="status" aria-live="polite"></p>
            <div class="hist-list" id="list"></div>
            <p class="hist-footnote">本目录为精选导读；朝代分组用于浏览，跨时期事件按主题归类。年代存疑、长期进程与文学演绎会在详情中说明。</p>
        </section>
        <article class="hist-detail" id="detail" aria-labelledby="detail-title" hidden></article>
        <p class="hist-message" id="loading" role="status">正在加载历史事件…</p>
        <button class="hist-button" id="retry" type="button" hidden>重新加载</button>
        <noscript>请启用 JavaScript 以查看历史事件目录与详情。</noscript>
    </div>
</main>
<script src="../js/bridge.js"></script>
<script src="../../assets/js/app-common.js" defer></script>
<script src="../js/history-events.js" defer></script>
</body>
</html>
