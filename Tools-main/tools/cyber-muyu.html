<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>赛博木鱼</title>
<link rel="stylesheet" href="../css/common.css">

<link rel="stylesheet" href="../../assets/css/apps.css">
<link rel="stylesheet" href="../../assets/css/muyu.css">
</head>
<body class="embedded muyu-view">
<div class="game-inner">
    <div class="muyu-wrap">
        <div class="muyu-title">赛 博 木 鱼</div>
        <div class="muyu-count">已敲 <b id="count">0</b> 次</div>
        <button type="button" class="muyu-body" id="muyu" aria-label="敲木鱼，播放诵念声音">
            <img class="muyu-wood" src="../../assets/images/muyu.png" alt="" draggable="false">
            <span class="muyu-mallet" aria-hidden="true"></span>
            <span class="muyu-feedback" aria-hidden="true">功德 +1</span>
        </button>
        <div class="muyu-hint">轻敲木鱼 · 静听佛号</div>
        <div class="muyu-merit" id="merit">功德无量</div>
        <button class="muyu-btn" id="btnReset">归 零</button>
        <p id="storageStatus" role="status"></p>
        <p id="soundStatus" role="status"></p>
        <audio id="chantAudio" src="../../assets/music/muyu-chant.wav" preload="auto" hidden></audio>
    </div>
</div>

<script src="../js/bridge.js"></script>
<script src="../../assets/js/app-common.js" defer></script>
<script src="../../assets/js/muyu.js" defer></script>
</body>
</html>
